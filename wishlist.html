<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist · Tabungan</title>
  <link rel="stylesheet" href="wishlist.css">
  <script src="wishlist.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page__head">
      <div>
        <h1>Wishlist</h1>
        <p class="muted">Progress dihitung dari tabungan yang tercatat. Uang tetap bagian dari total keuangan.</p>
      </div>
    </header>

    <section aria-labelledby="hActive">
      <h2 class="group" id="hActive">Sedang berjalan</h2>
      <div class="grid" id="activeGrid"></div>
    </section>
    <section aria-labelledby="hDone" id="doneSection" hidden>
      <h2 class="group" id="hDone">Tercapai</h2>
      <div class="grid" id="doneGrid"></div>
    </section>
  </main>

  <button type="button" class="add-btn" id="addBtn" aria-label="Tambah wishlist">+ <span>Tambah</span></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Form tambah / edit -->
  <dialog id="formDialog" class="modal">
    <form id="wForm" novalidate>
      <h2 id="formTitle">Tambah wishlist</h2>
      <label class="field">Nama barang<input id="fNama" class="input" type="text" maxlength="60" autocomplete="off"></label>
      <label class="field">Target nominal<input id="fNominal" class="input" type="text" inputmode="numeric" placeholder="0" autocomplete="off"></label>
      <label class="field">Target tanggal<input id="fTanggal" class="input" type="date"></label>
      <fieldset class="field">
        <legend>Warna card</legend>
        <div class="swatches" id="swatches"></div>
      </fieldset>
      <label class="switch">
        <input type="checkbox" id="fMain">
        <span class="switch__ui" aria-hidden="true"></span>
        <span>Jadikan wishlist utama</span>
      </label>
      <p class="error" id="formError" role="alert"></p>
      <div class="actions">
        <button type="button" class="btn btn--ghost" data-close>Batal</button>
        <button type="submit" class="btn btn--primary" id="saveBtn">Simpan</button>
      </div>
    </form>
  </dialog>

  <!-- Konfirmasi hapus -->
  <dialog id="confirmDialog" class="modal modal--sm">
    <h2>Hapus wishlist?</h2>
    <p class="muted" id="confirmText"></p>
    <div class="actions">
      <button type="button" class="btn btn--ghost" data-close>Batal</button>
      <button type="button" class="btn btn--danger" id="confirmYes">Hapus</button>
    </div>
  </dialog>
</body>
</html>
