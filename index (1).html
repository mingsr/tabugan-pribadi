<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nabung Untuk Masa Depan</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- Boot -->
  <section class="center" data-view="boot">
    <div class="tc"><div class="spin"></div><p class="muted">Memeriksa sesi…</p></div>
  </section>

  <!-- Error koneksi saat boot -->
  <section class="center" data-view="error" hidden>
    <div class="panel tc">
      <p class="brand">Tidak dapat memuat aplikasi</p>
      <p class="err" id="bootError"></p>
      <button type="button" class="btn" id="retryBoot">Coba lagi</button>
    </div>
  </section>

  <!-- Login -->
  <section class="center" data-view="login" hidden>
    <form class="panel" id="loginForm" novalidate>
      <p class="brand">Nabung Untuk Masa Depan</p>
      <p class="muted">Masuk untuk melanjutkan.</p>
      <label class="field">Username<input id="loginUser" class="input" type="text" autocomplete="username" autocapitalize="none"></label>
      <label class="field">Password<input id="loginPass" class="input" type="password" autocomplete="current-password"></label>
      <p class="err" id="loginError" role="alert"></p>
      <button type="submit" class="btn btn--primary" id="loginBtn">Masuk</button>
    </form>
  </section>

  <!-- Shell -->
  <div class="shell" data-view="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <p class="brand">Nabung Untuk<br>Masa Depan</p>
      <nav>
        <ul class="nav">
          <li><a href="#/dashboard" data-page="dashboard"><i aria-hidden="true">▦</i>Dashboard</a></li>
          <li><a href="#/finance" data-page="finance"><i aria-hidden="true">↕</i>Keuangan</a></li>
          <li><a href="#/wishlist" data-page="wishlist"><i aria-hidden="true">★</i>Wishlist</a></li>
          <li><a href="#/statistics" data-page="statistics"><i aria-hidden="true">◔</i>Statistik</a></li>
          <li><a href="#/settings" data-page="settings"><i aria-hidden="true">⚙</i>Pengaturan</a></li>
        </ul>
      </nav>
      <button type="button" class="btn logout" id="logoutBtn">⏻&nbsp; Keluar</button>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <header class="topbar">
      <button type="button" class="icon-btn" id="menuBtn" aria-label="Buka menu" aria-expanded="false" aria-controls="sidebar">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="who">Masuk sebagai <b id="userName">-</b></span>
      <button type="button" class="icon-btn" id="reloadBtn" aria-label="Muat ulang halaman" title="Muat ulang halaman">↻</button>
    </header>

    <main class="content">
      <iframe id="frame" title="Konten halaman" src="about:blank"></iframe>
      <div class="overlay" id="frameLoading" hidden><div class="spin"></div></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
</body>
</html>
